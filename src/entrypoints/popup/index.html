<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sachet — Phishing X-ray</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="app">
      <header class="header">
        <div class="brand">
          <span class="logo" aria-hidden="true">◉</span>
          <div>
            <h1>Sachet</h1>
            <p id="tagline" class="tagline"></p>
          </div>
        </div>
        <button id="lang-toggle" class="lang-toggle" type="button" title="Switch language / भाषा बदल्नुहोस्">नेपाली</button>
      </header>

      <section class="domain-row">
        <span class="label">Page</span>
        <span id="domain" class="domain">—</span>
      </section>

      <div id="verdict-card" class="verdict-card verdict-gray">
        <p id="verdict-title" class="verdict-title"></p>
        <p id="verdict-sub" class="verdict-sub"></p>
      </div>

      <section class="reasons">
        <h2 id="reasons-title">Why this verdict</h2>
        <ul id="reasons-list"></ul>
      </section>

      <details class="checked">
        <summary id="checked-title">What was checked</summary>
        <ul id="checked-list"></ul>
      </details>

      <div class="actions">
        <button id="xray-button" class="btn primary" type="button">X-ray this page</button>
        <button id="official-button" class="btn" type="button" hidden>Open the official site</button>
        <button id="report-button" class="btn danger-outline" type="button">Report this page</button>
      </div>
      <p id="report-done" class="report-done" hidden></p>

      <section class="link-check">
        <h2 id="linkcheck-title">Check a link before you open it</h2>
        <div class="link-row">
          <input id="link-input" type="text" inputmode="url" autocomplete="off" spellcheck="false" />
          <button id="link-button" class="btn" type="button">Check link</button>
        </div>
        <p id="link-note" class="link-note"></p>
      </section>

      <section class="auto-protect">
        <label class="auto-row">
          <input id="auto-toggle" type="checkbox" />
          <span id="auto-label"></span>
        </label>
        <p id="auto-note" class="auto-note"></p>
        <p id="auto-denied" class="auto-denied" hidden></p>
      </section>

      <footer class="privacy">
        <p id="privacy-note"></p>
        <p><a id="privacy-link" href="https://github.com/Samir-Khadka/phishlens/blob/main/PRIVACY.md" target="_blank" rel="noopener">Privacy policy</a></p>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
